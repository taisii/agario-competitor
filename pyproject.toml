[project]
name = "agario-competitor-template"
version = "0.1.0"
description = "Starter repository for an Agar.io competition bot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "agario-kit",
]

[tool.uv]
package = false

[tool.ruff.lint]
select = ["F401", "F811", "F821", "F841"]

[tool.pytest.ini_options]
pythonpath = [".", "bots"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.15.21",
    "vulture>=2.16",
]
